{% extends "base.html" %}
{% block content %}
<div class="row g-4">
<div class="col-md-5">{% if product.image %}<img class="img-fluid rounded-4" src="{{ product.image.url }}" alt="{{ product.name }}">{% else %}<div class="product-placeholder rounded-4">🌾</div>{% endif %}</div>
<div class="col-md-7">
<h1>{{ product.name }}</h1><p class="text-muted">SKU: {{ product.sku }}</p>
<h3 class="text-success">₹{{ product.price }}</h3><p>{{ product.description }}</p>
<p>Available stock: {{ product.stock }}</p>
<form method="post" action="{% url 'add_to_cart' product.pk %}">{% csrf_token %}
<label class="form-label">Quantity</label><input class="form-control mb-3" type="number" name="quantity" min="1" max="{{ product.stock }}" value="1" style="max-width:130px">
<button class="btn btn-success">Add to cart</button></form>
</div></div>
{% endblock %}
